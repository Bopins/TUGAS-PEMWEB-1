<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Formulir Pendaftaran | Tugas Pemweb</title>
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <header>
      <h1>Tugas Pemrograman Web</h1>
      <p>Latihan HTML — 8 Halaman</p>
    </header>

    <nav aria-label="Navigasi utama">
      <a href="index.html" class="">Beranda</a>
      <a href="profile.html" class="">Profil</a>
      <a href="about-me.html" class="">Tentang Saya</a>
      <a href="educations.html" class="">Pendidikan</a>
      <a href="course-schedule.html" class="">Jadwal</a>
      <a href="hobbies.html" class="">Hobi</a>
      <a href="form.html" class="active">Formulir</a>
      <a href="table1.html" class="">Tabel 1</a>
      <a href="table2.html" class="">Tabel 2</a>
    </nav>

    <main>
      <section class="panel">
        <h2>Formulir Pendaftaran</h2>
        <p class="note"></p>

        <form id="daftar">
          <label for="nama">Nama Lengkap:</label>
          <input id="nama" name="nama" placeholder="Masukkan nama" required />

          <label for="email">Email:</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="nama@email.com"
            required
          />

          <label for="password">Password:</label>
          <input
            id="password"
            name="password"
            type="password"
            minlength="6"
            required
          />

          <label for="umur">Umur:</label>
          <input id="umur" name="umur" type="number" min="1" max="120" />

          <label for="lahir">Tanggal Lahir:</label>
          <input id="lahir" name="lahir" type="date" />

          <fieldset>
            <legend>Jenis Kelamin:</legend>
            <label><input type="radio" name="jk" value="Laki-laki" />Laki-laki</label>
            <label><input type="radio" name="jk" value="Perempuan" />Perempuan</label>
          </fieldset>

          <fieldset>
            <legend>Hobi:</legend>
            <label><input type="checkbox" name="hobi" value="Coding" />Coding</label>
            <label><input type="checkbox" name="hobi" value="Gaming" />Gaming</label>
            <label><input type="checkbox" name="hobi" value="Olahraga" />Olahraga</label>
          </fieldset>

          <label for="jurusan">Jurusan:</label>
          <select id="jurusan" name="jurusan">
            <option value="">-- Pilih Jurusan --</option>
            <option>Sistem Informasi</option>
            <option>Teknik Informatika</option>
            <option>Manajemen Informatika</option>
          </select>

          <label for="alamat">Alamat:</label>
          <textarea id="alamat" name="alamat" rows="4" placeholder="Masukkan alamat"></textarea>

          <label for="foto">Foto:</label>
          <input id="foto" name="foto" type="file" accept="image/*" />

          <label for="website">Website:</label>
          <input id="website" name="website" type="url" placeholder="https://example.com" />

          <button type="submit">Kirim</button>
          <button type="reset">Reset</button>

          <p id="pesan" role="status"></p>
        </form>

        <script>
          document
            .getElementById('daftar')
            .addEventListener('submit', function (e) {
              e.preventDefault();
              document.getElementById('pesan').textContent =
                'Validasi berhasil. Ini hanya contoh formulir, data tidak disimpan.';
            });

          document.getElementById('daftar').addEventListener('reset', function () {
            document.getElementById('pesan').textContent = '';
          });
        </script>
      </section>
    </main>

    <footer>© 2026 | Tugas Pemrograman Web</footer>
  </body>
</html>
